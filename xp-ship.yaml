# xp-ship as a graph: deterministic checks -> parallel read-only reviews
# -> script gate -> human gate -> PR.
#
# Run from this directory, pointing at the repo and issue to ship:
#   conductor run xp-ship.yaml --web --input repo=$HOME/git/skills --input issue=16

workflow:
  name: xp-ship
  description: Check, review and open the PR for a finished XP issue
  version: "0.1.0"
  entry_point: check

  runtime:
    provider: copilot
    plugins:
      - ../skills/plugins/xp

  input:
    repo:
      type: string
      required: true
      description: Absolute path to the repository to ship (~ is not expanded)
    issue:
      type: string
      required: true
      description: Issue number being shipped
    base:
      type: string
      required: false
      default: main
    test_cmd:
      type: string
      required: false
      default: npm test
    test_dirs:
      type: string
      required: false
      default: tests
      description: Where tests that name criteria live (space separated)

  context:
    mode: explicit

  limits:
    max_iterations: 20
    timeout_seconds: 1800

# Every agent inherits this allowlist: read and search, no shell, no edits.
# ponytail: prompt-level read-only on the host; use a sandbox before unattended runs.
tools: [view, grep, glob]

parallel:
  - name: reviews
    description: Independent read-only reviews of the same commit
    agents: [scope_review, impact_review, simplicity_review]
    failure_mode: all_or_nothing
    routes:
      - to: gate

agents:
  - name: check
    type: script
    description: Tests and criterion traceability (xp-ship check 1-2)
    command: node
    args:
      - scripts/check.mjs
      - "{{ workflow.input.repo }}"
      - "{{ workflow.input.base }}"
      - "{{ workflow.input.issue }}"
      - "{{ workflow.input.test_cmd }}"
      - "{{ workflow.input.test_dirs }}"
    output:
      sha: { type: string }
      diff: { type: string }
      diff_truncated: { type: boolean }
      tests_passed: { type: boolean }
      test_log: { type: string }
      criteria: { type: array }
      missing_criteria: { type: array }
    routes:
      # No review tokens spent on red tests or untraced criteria.
      - to: blocked
        when: "{{ not output.tests_passed or output.missing_criteria | length > 0 }}"
      - to: reviews

  - name: scope_review
    description: xp-ship check 3, scope against the issue
    working_dir: "{{ workflow.input.repo }}"
    input: [workflow.input.repo, workflow.input.issue, check.output]
    prompt: |
      Follow step 1.3 "Scope" of the xp-ship skill for issue #{{ workflow.input.issue }}
      at commit {{ check.output.sha }}. Read the issue in the repo's context and
      flag changes in this diff that no criterion asks for. Do not edit anything.

      ```diff
      {{ check.output.diff }}
      ```
    output:
      passed: { type: boolean, description: true if nothing is out of scope }
      findings: { type: array, description: One line per finding }

  - name: impact_review
    description: xp-ship check 4, the code around the diff
    working_dir: "{{ workflow.input.repo }}"
    input: [workflow.input.repo, workflow.input.issue, check.output]
    prompt: |
      Follow step 1.4 "Around the diff" of the xp-ship skill at commit
      {{ check.output.sha }}: find users of everything this diff changes, renames
      or deletes, and review the changed code for bugs, missing input checks and
      security. Do not edit anything.

      ```diff
      {{ check.output.diff }}
      ```
    output:
      passed: { type: boolean, description: true if nothing is broken }
      findings: { type: array, description: One line per finding }

  - name: simplicity_review
    description: xp-ship check 5, simplicity
    working_dir: "{{ workflow.input.repo }}"
    input: [workflow.input.repo, workflow.input.issue, check.output]
    prompt: |
      Follow step 1.5 "Simplicity" of the xp-ship skill at commit
      {{ check.output.sha }}, in both directions: overbuilding, and missing input
      checks, data-loss handling, security or accessibility. Do not edit anything.

      ```diff
      {{ check.output.diff }}
      ```
    output:
      passed: { type: boolean, description: true if nothing needs to change }
      findings: { type: array, description: One line per finding }

  - name: gate
    type: script
    description: All green and HEAD unchanged, or blocked
    command: node
    args: [scripts/gate.mjs, "{{ workflow.input.repo }}"]
    input: [check.output, reviews.outputs]
    stdin: >-
      {{ {"check": check.output, "reviews": reviews.outputs} | tojson }}
    output:
      passed: { type: boolean }
      reasons: { type: array }
    routes:
      - to: approve
        when: "{{ output.passed }}"
      - to: blocked

  - name: approve
    type: human_gate
    input: [check.output, reviews.outputs]
    prompt: |
      Issue #{{ workflow.input.issue }} at {{ check.output.sha[:8] }} passed tests,
      traceability ({{ check.output.criteria | join(", ") }}) and all reviews.

      Findings:
      {% for name, r in reviews.outputs.items() %}
      - {{ name }}: {{ r.findings | join("; ") or "none" }}
      {% endfor %}

      Open the pull request?
    options:
      - label: Open PR
        value: approve
        route: open_pr
      - label: Stop
        value: reject
        route: rejected

  - name: open_pr
    type: script
    description: Open or reuse the PR (idempotent per branch)
    command: sh
    args:
      - scripts/open-pr.sh
      - "{{ workflow.input.repo }}"
      - "{{ workflow.input.base }}"
      - "{{ workflow.input.issue }}"
    output:
      url: { type: string }
    routes:
      - to: $end

  - name: blocked
    type: terminate
    status: failed
    reason: "Ship blocked: tests, traceability or a review failed"

  - name: rejected
    type: terminate
    status: failed
    reason: Stopped at the human gate

output:
  pr: "{% if open_pr is defined %}{{ open_pr.output.url }}{% endif %}"
